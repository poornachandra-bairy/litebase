# Litebase, ready to run with "docker compose up -d".
#
# Copy .env.example to .env first and set at least LITEBASE_ADMIN_PASSWORD and
# LITEBASE_BACKUP_ENCRYPTION_KEY. Everything else has a working default.

services:
  litebase:
    build:
      context: .
      args:
        VERSION: ${LITEBASE_VERSION:-dev}
    image: litebase:${LITEBASE_VERSION:-latest}
    container_name: litebase
    restart: unless-stopped

    ports:
      # Bound to localhost by default. Put a TLS-terminating reverse proxy in
      # front before exposing this to the internet, and then set
      # LITEBASE_SECURE_COOKIES=true and LITEBASE_TRUST_PROXY=true.
      - "${LITEBASE_PORT:-8090}:8090"

    env_file:
      - .env

    environment:
      LITEBASE_DATA_DIR: /data
      LITEBASE_ADDR: 0.0.0.0:8090

    volumes:
      # All databases, backups and metadata live here. Back this up, or use
      # Litebase's own scheduled backups to a remote provider.
      - litebase-data:/data

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Modest hardening: the app never needs new privileges, and the only path
    # it writes to is the data volume.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  litebase-data:
    driver: local
