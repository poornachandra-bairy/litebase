# Litebase.
#
# Works unchanged in two places:
#
#   docker compose up -d      on your own machine or any Docker host
#   Coolify                   choose the "Docker Compose" build pack
#
# Nothing needs configuring. The server generates its own administrator
# password and encryption key on first start, and detects that it is running
# behind a proxy. The volume below is what keeps your data across redeploys.
#
# Note on style: "environment" is written as a mapping rather than a list.
# Coolify rewrites this section to merge in variables defined in its UI, and a
# list does not survive that rewrite - it comes back with integer keys and the
# deploy fails with "non-string key in services.litebase.environment: 0".

services:
  litebase:
    build:
      context: .
      args:
        VERSION: ${LITEBASE_VERSION:-dev}
    restart: unless-stopped

    environment:
      # Paths inside the image. Leave these alone.
      LITEBASE_DATA_DIR: /data
      LITEBASE_ADDR: 0.0.0.0:8090
      LITEBASE_LOG_FORMAT: json

    # Published to the proxy but deliberately not mapped onto a host port:
    # doing that would expose the app over plain HTTP on http://SERVER_IP:8090,
    # bypassing the certificate the proxy terminates. Coolify routes its
    # assigned domain to this port.
    expose:
      - "8090"

    volumes:
      # Databases, metadata and local backups. Coolify creates this volume
      # automatically, so data survives every redeploy.
      - litebase-data:/data

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  litebase-data:
